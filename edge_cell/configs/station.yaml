# Station config: ports, cameras, taught poses, safety limits, model choice.
# Joint order everywhere: shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll, gripper
# Units: Studio "normalized": body joints -100..100 over the calibrated range, gripper 0..100.

python: /home/intel/physical-ai-studio/application/backend/.venv/bin/python

robot:
  follower_port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B91030604-if00   # serial 5B91030604
  leader_port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AE7045174-if00     # serial 5AE7045174 (new leader board)
  follower_calibration: configs/calibration/follower.json   # exported from Physical AI Studio
  unit: normalized
  fps: 30

cameras:
  # name: Studio camera name (== dataset key observation.images.<name>, model input images.<name>)
  # publisher: iceoryx2 service Studio's camera publisher uses (we read frames, never open the device)
  top:     {studio_name: top, serial: "344223022915", publisher: physicalai/camera/UVCCamera/8/frame, width: 640, height: 480, fps: 30}
  inspect: {studio_name: inspect, serial: "344223025244", publisher: physicalai/camera/UVCCamera/14/frame, width: 640, height: 480, fps: 30}
  wrist:   {studio_name: wrist, serial: "USB2.0_CAM1", publisher: physicalai/camera/UVCCamera/16/frame, width: 640, height: 480, fps: 30}
  fingerprint:   # Studio's camera fingerprints (UVCCamera device=...)
    top: {bus: "usb-0000:00:0d.0-4.4.3", index: 8, sensor: "", serial: "344223022915"}
    inspect: {bus: "usb-0000:00:0d.0-4.3", index: 14, sensor: "", serial: "344223025244"}
    wrist: {bus: "usb-0000:00:14.0-2.4.4", index: 16, sensor: "", serial: "USB2.0_CAM1"}
  stale_frame_s: 0.5          # no new frame for this long -> stop

poses:
  # Taught Sat 21:34 Helsinki: follower measured during leader teleop (cell/teach.py)
  home:          [85.7, 58.9, -60.2, 81.4, 25.5, 2.4]
  inspect:       [-73.4, -3.1, -2.2, 85.4, 1.3, 16.0]
  inspect_view2: [-77.7, -32.0, 34.8, 62.1, 41.8, 15.9]
  inspect_view3: [-78.1, -56.8, 73.6, 28.6, -39.2, 15.9]
  above_plate:   [66.0, -7.4, 21.8, 86.5, 12.7, 44.7]
  travel:        [14.0, -8.5, -22.4, 97.3, 4.6, 44.3]   # raised high: scripted long moves go up, sideways, down through it
  taught: true

inspection:
  camera: inspect
  crop: [160, 80, 320, 320]   # x, y, w, h (not used yet: model sees the full 640x480 frame)
  crop_enabled: false
  t_low: 0.45                 # patchcore_v1 REPLAY: good max 0.57, defect min 0.50 (see models/anomaly/patchcore_v1)
  t_high: 0.60
  max_views: 1                # views 2/3: gripper finger hides the brick; good bricks scored 0.49-0.63 there (REAL, photos run 12:01)
  timeout_s: 3.0

models:
  policy_dir: models/policy/current          # SmolVLA v1: places (text picks the bowl)
  pick_policy_dir: models/policy/act_v2      # ACT v2 picks (2.5/3 REAL vs SmolVLA 0/4); --pick-model overrides
  policy_device: GPU          # falls back to CPU while OpenVINO lists only CPU (see docs/FACTS.md)
  anomaly_dir: models/anomaly/current
  anomaly_device: NPU

skills:
  pick_present: {instruction: "Pick up a brick and hold it in front of the inspection camera.", timeout_s: 45}   # ACT v2 re-grabs after a miss; on timeout at the plate it keeps trying (max_pick_attempts), then shows the camera
  place_good:   {instruction: "Put the brick in the good bowl.", timeout_s: 20}
  place_defect: {instruction: "Put the brick in the defective bowl.", timeout_s: 20}
  scripted_move_timeout_s: 10

safety:
  # from duplo_v1 (117 eps) action range + ~8 margin; wrist_roll full range for inspect views
  joint_min: [-95, -62, -85,  15, -100,   0]
  joint_max: [ 98,  72,  82, 100,  100, 100]
  max_step_per_tick: [2.5, 2.5, 2.5, 3.0, 4.0, 5.0]   # normalized units per tick at speed 1.0 (30 fps): ~75/s
  speed: 0.3                  # 0..1 multiplier for SCRIPTED moves
  policy_speed: 1.5           # multiplier for LEARNED skills (demos move up to ~4 units/tick); --policy-speed overrides
  settle_tol: 3.5             # |joint - target| below this = arrived (servos stop ~2.5 short under load)
  settle_s: 0.4

run:
  max_bricks: 20
  max_pick_attempts: 3        # first try + 2 re-picks on NO_BRICK or pick timeout
  release_open: 40            # after a place skill: hold still, open the gripper to this...
  release_s: 1.0              # ...for this long before the (scripted) move home; home route keeps it open until the end
  pick_near_inspect: 40       # pick timeout within this of the inspect pose: snap + check; farther: keep trying in place
  max_regrasps: 1
  exec_horizon: 30            # re-plan after 30 actions (1 s): ACT pick 2.5/3 with it vs 1/3 without
